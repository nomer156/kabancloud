# ==============================================================================
# Nginx Configuration for Ufanet KabanCloud on Debian 13.7 (1 Core / 1GB RAM / 8GB Disk)
# Оптимизирован для ультранизкого потребления памяти (< 15MB RAM) и сжатия gzip
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Корневой каталог со статикой React (раздача напрямую Nginx минуя Node.js)
    root /opt/kaban2/dist;
    index index.html;

    # Максимальный размер загрузки вложений (чертежи, DWG, PDF)
    client_max_body_size 50M;

    # Сжатие Gzip (экономия трафика и мгновенный отклик)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Кэширование статических ассетов Vite (1 год, immutability)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Кэширование загруженных файлов задач
    location /uploads/ {
        alias /opt/kaban2/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Реалтайм SSE стрим (критично отключить буферизацию для мгновенных сообщений YouGile!)
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Отключение буферизации для SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Все остальные API запросы проксируются в Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA роутинг: все неизвестные пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
