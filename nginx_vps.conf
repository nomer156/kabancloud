# ==============================================================================
# Nginx Configuration for Ufanet KabanCloud (Доска)
# Domain: doska.odn.ufanet.ru
# Reverse Proxy to Node.js backend (127.0.0.1:3000) with full HTTPS and SSE
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server (Port 80) -> ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doska.odn.ufanet.ru 188.191.125.10 _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://doska.odn.ufanet.ru$request_uri;
    }
}

# 2. HTTPS Server (Port 443) -> Full Reverse Proxy to Node.js
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doska.odn.ufanet.ru 188.191.125.10 _;

    ssl_certificate /etc/ssl/kaban/doska.crt;
    ssl_certificate_key /etc/ssl/kaban/doska.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
