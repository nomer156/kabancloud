# ==============================================================================
# УФАНЕТ • Nginx Конфигурация виртуального хоста для KabanCloud на VPS
# Скопировать в: /etc/nginx/sites-available/kabancloud
# Активировать: ln -s /etc/nginx/sites-available/kabancloud /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name kaban.ufanet.ru your-vps-ip.com;

    # Максимальный размер загружаемых чертежей/файлов
    client_max_body_size 50M;

    # Сжатие Gzip для ускорения загрузки интерфейса
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Раздача статики фронтенда (директория dist)
    location / {
        root /var/www/kabancloud/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксирование API запросов к Node.js бэкенду
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Заголовки проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Потоковый Realtime канал Server-Sent Events (SSE)
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Отключение буферизации Nginx для моментальной доставки событий
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        chunked_transfer_encoding off;
    }

    # Раздача загруженных файлов и чертежей
    location /uploads/ {
        alias /var/www/kabancloud/data/uploads/;
        expires 7d;
        add_header Content-Disposition "inline";
    }
}
